<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Categories | Nova Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="flex min-h-screen">
        <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 fixed inset-y-0 left-0 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
            <div class="p-6">
                <div class="text-white font-bold text-xl mb-10 flex items-center gap-2">
                    <span class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-sm">N</span>
                    Nova Admin
                </div>
                <nav class="space-y-1">
                    <a href="../analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">Analytics</a>
                    <a href="../announcements/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">Announcements</a>
                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white font-medium">Categories</a>
                    <a href="../comments/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">Comments</a>
                </nav>
            </div>
        </aside>

        <main class="flex-1 lg:ml-64 p-4 md:p-8">
            <header class="flex justify-between items-center mb-10">
                <div class="flex items-center gap-4">
                    <button id="menuBtn" class="lg:hidden p-2 bg-white border border-slate-200 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    </button>
                    <h1 class="text-2xl font-bold">Category Management</h1>
                </div>
                <button class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-blue-700 transition text-sm">
                    + Add Category
                </button>
            </header>

            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-bold">
                        <tr>
                            <th class="px-6 py-4">Category Name</th>
                            <th class="px-6 py-4">Slug</th>
                            <th class="px-6 py-4">Description</th>
                            <th class="px-6 py-4">Posts</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm">
                        <tr>
                            <td class="px-6 py-4 font-bold text-slate-800">New Arrivals</td>
                            <td class="px-6 py-4 text-slate-500">/new-arrivals</td>
                            <td class="px-6 py-4 text-slate-500 max-w-xs truncate">Latest product launches and collection drops.</td>
                            <td class="px-6 py-4"><span class="bg-slate-100 px-2 py-1 rounded text-xs font-semibold">12</span></td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-blue-600 font-medium hover:underline">Edit</button>
                                <button class="text-red-400 ml-4 hover:text-red-600">Delete</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4 font-bold text-slate-800">Exclusive Sales</td>
                            <td class="px-6 py-4 text-slate-500">/sales</td>
                            <td class="px-6 py-4 text-slate-500 max-w-xs truncate">Promotions, clearance events, and flash sales.</td>
                            <td class="px-6 py-4"><span class="bg-slate-100 px-2 py-1 rounded text-xs font-semibold">8</span></td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-blue-600 font-medium hover:underline">Edit</button>
                                <button class="text-red-400 ml-4 hover:text-red-600">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });
    </script>
</body>
</html>
