<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Settings | Nova Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="flex min-h-screen">
        <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 fixed inset-y-0 left-0 z-50 lg:translate-x-0 -translate-x-full transition-transform">
            <div class="p-6">
                <div class="text-white font-bold text-xl mb-10">Nova Admin</div>
                <nav class="space-y-1">
                    <a href="analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">Analytics</a>
                    <a href="announcements/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">Announcements</a>
                    <a href="categories/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">Categories</a>
                    <a href="comments/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">Comments</a>
                    <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white font-medium">Settings</a>
                </nav>
            </div>
        </aside>

        <main class="flex-1 lg:ml-64 p-8">
            <h1 class="text-2xl font-bold mb-10">Settings</h1>

            <div class="max-w-4xl space-y-8">
                <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100">
                        <h2 class="font-bold">Store Branding</h2>
                        <p class="text-sm text-slate-400">Configure how your store appears to the public.</p>
                    </div>
                    <div class="p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Store Name</label>
                                <input type="text" value="Nova Store" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Accent Color</label>
                                <div class="flex gap-2">
                                    <input type="text" value="#3b82f6" class="flex-1 p-2.5 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                                    <div class="w-10 h-10 rounded-lg bg-blue-500 border border-slate-200"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100">
                        <h2 class="font-bold">Admin Profile</h2>
                    </div>
                    <div class="p-6 space-y-4">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-xl">AD</div>
                            <button class="text-sm font-bold text-blue-600 hover:underline">Change Photo</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Email Address</label>
                                <input type="email" value="admin@novastore.com" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Password</label>
                                <button class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-50">Reset Password</button>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-6 flex justify-end">
                        <button class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-blue-700 transition">Save Changes</button>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
