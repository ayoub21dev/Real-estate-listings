<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Create Announcement | Nova Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-slate-900 text-slate-300 fixed inset-y-0 left-0 z-50">
            <div class="p-6">
                <div class="text-white font-bold text-xl mb-10">Nova Admin</div>
                <nav class="space-y-1">
                    <a href="../analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">Analytics</a>
                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white font-medium">Announcements</a>
                    <a href="../categories/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">Categories</a>
                    <a href="../comments/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">Comments</a>
                </nav>
            </div>
        </aside>

        <main class="flex-1 ml-64 p-8">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <a href="index.html" class="text-blue-600 text-sm font-medium hover:underline">← Back to List</a>
                    <h1 class="text-2xl font-bold">New Announcement</h1>
                </div>
                <div class="flex gap-3">
                    <button class="px-6 py-2.5 bg-white border border-slate-200 rounded-lg font-bold text-sm hover:bg-slate-50 transition">Save Draft</button>
                    <button class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold text-sm hover:bg-blue-700 transition shadow-lg shadow-blue-200">Publish Now</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2 tracking-wider">Announcement Title</label>
                            <input type="text" placeholder="e.g. Spring 2025 Collection Drop" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg font-medium text-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2 tracking-wider">URL Slug</label>
                            <input type="text" placeholder="spring-2025-collection" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-500">
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-slate-200 space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-2 tracking-wider">Main Content</label>
                            <div class="border border-slate-200 rounded-lg overflow-hidden">
                                <div class="bg-slate-50 p-2 border-b border-slate-200 flex gap-4">
                                    <button class="font-bold px-2 hover:bg-slate-200 rounded">B</button>
                                    <button class="italic px-2 hover:bg-slate-200 rounded">I</button>
                                    <button class="underline px-2 hover:bg-slate-200 rounded">U</button>
                                </div>
                                <textarea rows="12" placeholder="Write your announcement content here... (Markdown supported)" class="w-full p-4 outline-none resize-none"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-slate-200">
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider">Call to Action (Optional)</label>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" placeholder="Button Label (e.g. Shop Now)" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none">
                            <input type="text" placeholder="URL (e.g. /shop/azure)" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none">
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 sticky top-8">
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider">Settings</label>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Category</label>
                                <select class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                                    <option>New Arrivals</option>
                                    <option>Sales</option>
                                    <option>System Updates</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Schedule Date</label>
                                <input type="date" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                            </div>
                            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                                <span class="text-sm font-medium">Publicly Visible</span>
                                <div class="w-12 h-6 bg-blue-600 rounded-full flex items-center px-1">
                                    <div class="w-4 h-4 bg-white rounded-full translate-x-6"></div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-8">
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider">Desktop Preview</label>
                            <div class="border border-slate-100 rounded-lg p-3 scale-95 origin-top">
                                <div class="aspect-video bg-slate-100 rounded mb-2"></div>
                                <div class="h-2 w-1/3 bg-blue-100 rounded mb-2"></div>
                                <div class="h-4 w-full bg-slate-200 rounded mb-1"></div>
                                <div class="h-4 w-2/3 bg-slate-200 rounded"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
